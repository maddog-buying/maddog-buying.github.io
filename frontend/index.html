<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>貨態查詢</title>
  <meta name="description" content="查詢與管理貨物狀態">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="貨態查詢">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="progress" class="progress" hidden></div>

  <!-- 登入 -->
  <section id="view-login" class="view login" hidden>
    <div class="login-card">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1>貨態查詢</h1>
      <p class="muted">請使用 Google 帳號登入，查詢您綁定的貨物狀態。</p>
      <p id="login-msg" class="login-msg" role="alert"></p>
      <div id="login-actions" class="login-actions"></div>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="view-app" class="view" hidden>
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span>貨態查詢</span></div>
      <nav id="tabs" class="tabs" hidden>
        <button data-tab="mine">我的貨態</button>
        <button data-tab="admin">貨態管理</button>
        <button data-tab="users">使用者</button>
      </nav>
      <div class="me">
        <span id="me-email" class="me-email"></span>
        <span id="me-role" class="badge"></span>
        <button class="btn ghost sm" data-action="logout">登出</button>
      </div>
    </header>
    <div id="offline-banner" class="banner" hidden></div>
    <main class="container">
      <div id="tab-mine" class="tab" hidden></div>
      <div id="tab-admin" class="tab" hidden></div>
      <div id="tab-users" class="tab" hidden></div>
    </main>
  </section>

  <!-- 使用者綁定編號 -->
  <dialog id="dlg-bind" class="dialog">
    <form method="dialog" id="form-bind">
      <h2>綁定貨態編號</h2>
      <p class="muted">請輸入貨態編號與管理者提供的綁定碼。</p>
      <label>貨態編號<input name="id" required autocomplete="off" autocapitalize="characters"></label>
      <label>綁定碼<input name="code" required autocomplete="off" inputmode="numeric"></label>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button class="btn primary" value="ok">綁定</button>
      </div>
    </form>
  </dialog>

  <!-- 管理者：新增／編輯貨態 -->
  <dialog id="dlg-ship" class="dialog wide">
    <form method="dialog" id="form-ship">
      <h2 id="ship-title">新增貨態</h2>
      <div class="grid2">
        <label>貨態編號<input name="id" required autocomplete="off" autocapitalize="characters"></label>
        <label>狀態<select name="status" required></select></label>
      </div>
      <label>備註<textarea name="note" rows="2" placeholder="會一併記錄在歷程中"></textarea></label>
      <label>綁定碼
        <span class="input-row">
          <input name="bindCode" autocomplete="off" placeholder="留空則使用者無法自行綁定">
          <button type="button" class="btn sm" data-action="gen-code">產生</button>
        </span>
      </label>
      <div id="ship-extra" hidden>
        <h3>綁定帳號</h3>
        <div id="ship-emails" class="chips"></div>
        <div class="input-row">
          <input id="bind-email" type="email" placeholder="輸入 Google 帳號 Email（可用逗號分隔多筆）">
          <button type="button" class="btn sm" data-action="add-email">加入</button>
        </div>
        <h3>歷程</h3>
        <ol id="ship-history" class="timeline"></ol>
      </div>
      <div class="dlg-actions">
        <button type="button" class="btn danger ghost" data-action="delete-ship" id="btn-delete">刪除</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>關閉</button>
        <button class="btn primary" value="ok">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 管理者：批次更新 -->
  <dialog id="dlg-batch" class="dialog">
    <form method="dialog" id="form-batch">
      <h2>批次更新狀態</h2>
      <p class="muted" id="batch-count"></p>
      <label>狀態<select name="status" required></select></label>
      <label>備註<textarea name="note" rows="2"></textarea></label>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button class="btn primary" value="ok">更新</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="mock-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
